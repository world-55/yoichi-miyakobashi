<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BAR 夜市</title>
<meta name="description" content="お客さんの注文を覚えて出す、バーの記憶ゲーム。">
<meta name="theme-color" content="#130d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夜市">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#130d10;
  --panel:#24181b;
  --wood:#6b3d22;
  --wood-dk:#3e2213;
  --amber:#eaa43f;
  --neon:#ff5c93;
  --fg:#f7ecdf;
  --muted:#b9a493;
  --paper:#fff6e8;
  --ng:#ff4b3e;
  --ok:#7fd48a;
  --display:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box;display:flex;justify-content:center;overflow:hidden;
}
.app{position:relative;width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;gap:8px;user-select:none;-webkit-user-select:none}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hud .lv{font-family:var(--display);font-size:15px;color:var(--amber);white-space:nowrap}
.hud .sc{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.lbl{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);line-height:1;margin-bottom:2px}
.ngs{display:flex;gap:4px}
.mute{font-family:var(--body);font-weight:900;font-size:12px;padding:6px 8px;background:var(--panel);color:var(--fg);border:1px solid var(--muted);border-radius:6px;cursor:pointer}
.mute[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.mute:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.ngs span{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);font-size:9px;font-weight:900;display:grid;place-items:center;color:transparent}
.ngs span.on{background:var(--ng);border-color:var(--ng);color:#fff}

.scene{position:relative;flex:1 1 auto;min-height:230px;border-radius:10px;overflow:hidden;
  background:linear-gradient(#21141a, #170e12 55%, var(--wood-dk) 55.2%, var(--wood-dk) 100%)}
.sign{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:24px;color:#ffd5e4;white-space:nowrap;
  text-shadow:0 0 4px var(--neon),0 0 12px var(--neon),0 0 24px var(--neon);letter-spacing:.06em;animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.sign{animation:none}}
.shelf{position:absolute;left:0;right:0;top:52px;height:62px;display:flex;justify-content:center;align-items:flex-end;gap:4px;padding-inline:12px}
.shelf::after{content:"";position:absolute;left:8px;right:8px;bottom:-4px;height:5px;background:var(--wood);border-radius:2px;box-shadow:0 0 14px rgba(234,164,63,.35)}
.shelf svg{flex:none}
.staff{position:absolute;left:8px;right:8px;top:4px;display:flex;align-items:flex-start;gap:6px;z-index:7;pointer-events:none}
/* ママのセリフは「BAR 夜市」の看板と同じ高さの1行で出す */
.staff .say{margin-top:6px;height:35px;box-sizing:border-box;display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.staff .say{background:var(--paper);color:#2a1a14;font-weight:900;font-size:14px;padding:0 12px;border-radius:16px 16px 16px 3px;line-height:1;opacity:0;transform:translateY(4px);transition:.2s}
.staff .say.on{opacity:1;transform:none}
.counter{position:absolute;left:0;right:0;bottom:0;height:45%;}
.counter::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(#8a5230,var(--wood));box-shadow:0 4px 10px rgba(0,0,0,.5)}
.seats{position:absolute;left:6px;right:6px;bottom:8px;top:-60px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seat{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border-radius:10px;cursor:pointer;min-width:0}
.seat .who{position:relative;z-index:3;width:74px;max-width:100%;transition:transform .35s, opacity .35s}
.seat.empty .who{opacity:0;transform:translateY(30px)}
.seat.leaving .who{opacity:0;transform:translateX(30px)}
.seat.sel{background:rgba(234,164,63,.16);box-shadow:inset 0 0 0 2px var(--amber)}
.bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) scale(.85);width:max-content;min-width:56px;max-width:104px;box-sizing:border-box;background:var(--paper);color:#2a1a14;
  font-weight:900;font-size:13px;line-height:1.35;text-align:center;padding:6px 8px;border-radius:12px;z-index:6;opacity:0;transition:opacity .15s, transform .15s;
  box-shadow:0 4px 12px rgba(0,0,0,.45);pointer-events:none}
.bubble.on{transform:translateX(-50%) scale(1)}
.bubble::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.bubble.on{opacity:1}
.bubble.q{font-size:18px;color:#6b4a3a}
.bubble.happy{background:#e9f8e9;color:#235a2c}
.bubble.happy::after{border-top-color:#e9f8e9}
.bubble.angry{background:#ffe1dc;color:#9a1d12}
.bubble.angry::after{border-top-color:#ffe1dc}
.picks{height:22px;display:flex;gap:2px;justify-content:center;margin-top:2px}
.picks svg{width:22px;height:22px}
.pat{width:62px;max-width:90%;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-top:2px}
.pat i{display:block;height:100%;width:100%;background:var(--ok);border-radius:3px}
.seat.empty .pat,.seat.empty .picks{visibility:hidden}
.stool{width:40px;height:6px;background:#2a1710;border-radius:3px;margin-top:3px}

.menu{flex:none;display:flex;flex-direction:column;gap:6px}
.hint{font-size:12px;color:var(--muted);text-align:center;min-height:32px;white-space:pre-line;line-height:1.35;display:flex;align-items:center;justify-content:center}
.hint.warn{color:var(--ng);font-weight:700}
.hint.multi{color:var(--amber);font-weight:700;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.item{background:var(--panel);border:1px solid rgba(234,164,63,.25);border-radius:10px;color:var(--fg);font-family:var(--body);font-weight:700;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;cursor:pointer;min-width:0}
.item svg{width:36px;height:36px}
.item span{font-size:10px;line-height:1.2;min-height:2.4em;display:flex;align-items:center;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.item:active{transform:scale(.96);background:#33232a}
.item:focus-visible,.choose button:focus-visible,.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* 広告枠（広告がないときは hidden で非表示） */
.adtag{flex:none;font-size:9px;font-weight:900;letter-spacing:.06em;background:var(--amber);color:#2a1a14;padding:2px 5px;border-radius:3px;line-height:1.2}
.adtick{flex:none;display:flex;align-items:center;gap:6px;height:26px;padding-left:5px;background:#0c0709;border:1px solid rgba(234,164,63,.35);border-radius:6px;overflow:hidden}
.adtick.link{cursor:pointer}
.adtick.link:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.adtrack{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.adtrack span{display:inline-block;padding-left:100%;font-size:12px;font-weight:700;color:#ffe2b8;animation:adscroll var(--dur,20s) linear infinite}
@keyframes adscroll{to{transform:translateX(-100%)}}
.adtick.still{height:auto;min-height:26px;padding-block:4px;box-sizing:border-box}
.adtick.still .adtrack{text-align:center;padding-right:30px;white-space:normal}
.adtick.still .adtrack span{display:inline;animation:none;padding-left:0;line-height:1.4;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.adtrack span{animation:none;padding-left:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}}
.flowers{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:4px 2px;background:linear-gradient(#1d1216,#170e12);border:1px solid rgba(234,164,63,.18);border-radius:8px}
.flower{display:flex;flex-direction:column;align-items:center;min-width:0}
.flower .bunch{display:flex;justify-content:center;width:100%;min-width:0}
.flower svg{width:44px;height:40px;max-width:100%;flex:none}
.flower .bunch svg+svg{margin-left:-12px}
.flower .fname{margin-top:1px;width:100%;box-sizing:border-box;background:var(--paper);color:#2a1a14;font-size:8.5px;letter-spacing:-.03em;font-weight:900;line-height:1.25;padding:2px 1px;border-radius:2px;text-align:center;
  word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.flower.empty{visibility:hidden}
.pr{margin:0;font-size:14px;font-weight:900;line-height:1.6;color:#ffd5e4}
.ov{overflow-y:auto}
.adban{flex:none;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 10px;box-sizing:border-box;
  background:var(--panel);border:1px solid rgba(234,164,63,.35);border-radius:8px;overflow:hidden;color:var(--fg);text-decoration:none;font-weight:900;font-size:13px;text-align:center}
.adban .adtag{position:absolute;top:4px;left:4px}
.adban img{max-height:100%;max-width:100%;object-fit:contain}
.adban span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adban:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.ov{position:absolute;inset:0;background:rgba(10,6,8,.86);display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box;z-index:10;border-radius:10px}
.card{background:var(--panel);border-top:5px solid var(--neon);padding:18px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
.card h1,.card h2{font-family:var(--display);margin:0;font-weight:700}
.card h1{font-size:28px;color:#ffd5e4;text-shadow:0 0 10px var(--neon)}
.card h2{font-size:22px}
.note{font-size:12px;color:var(--muted);line-height:1.65;margin:0}
.note .oneline{white-space:nowrap;letter-spacing:-.02em;font-size:min(12px,3.15vw)}
.choose{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choose button{background:#1a1114;border:2px solid rgba(255,255,255,.12);border-radius:12px;color:var(--fg);font-family:var(--body);font-weight:900;font-size:12px;padding:8px 2px 7px;white-space:nowrap;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.choose button[aria-pressed="true"]{border-color:var(--amber);background:#2c1d16}
.choose svg{width:76px;height:76px;max-width:100%}
.btn{font-family:var(--display);font-size:20px;background:var(--amber);color:#2a1a14;border:0;border-radius:6px;padding:12px;cursor:pointer}
.btn.sub{background:var(--panel);color:var(--fg);font-size:15px;border:1px solid var(--muted)}
.contact{background:none;border:0;color:var(--muted);font-family:var(--body);font-weight:700;font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.contact:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.mail{font-size:17px;font-weight:900;color:var(--amber);word-break:break-all;background:#1a1114;border:1px solid rgba(234,164,63,.35);border-radius:6px;padding:10px;user-select:all;-webkit-user-select:all}
.big{font-family:var(--display);font-size:44px;color:var(--amber);line-height:1;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-size:22px;color:var(--amber);background:rgba(19,13,16,.9);padding:10px 18px;border-radius:8px;
  border:1px solid var(--amber);white-space:nowrap;z-index:5;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>

<div class="app" id="app">
  <div class="adtick" id="adTicker" hidden><span class="adtag">PR</span><div class="adtrack"><span id="adTickText"></span></div></div>

  <div class="hud">
    <div class="lv" id="lv">レベル1</div>
    <div><span class="lbl">SCORE</span><span class="sc" id="sc">0</span></div>
    <div><span class="lbl">NG</span><div class="ngs" id="ngs"><span>NG</span><span>NG</span><span>NG</span></div></div>
    <button class="mute" id="muteBtn" aria-pressed="true" aria-label="音楽のオンとオフ">♪ ON</button>
  </div>

  <div class="flowers" id="flowers" hidden></div>

  <div class="scene" id="scene">
    <div class="sign">BAR 夜市</div>
    <div class="shelf" id="shelf" aria-hidden="true"></div>
    <div class="staff"><div id="staffFace"></div><div class="say" id="say"></div></div>
    <div class="counter"><div class="seats" id="seats"></div></div>
    <div class="toast" id="toast"></div>  </div>

  <div class="menu">
    <div class="hint" id="hint">お客さんをタップ → 注文の品をタップ</div>
    <div class="grid" id="grid"></div>
  </div>

  <a class="adban" id="adBanner" hidden target="_blank" rel="noopener sponsored"><span class="adtag">AD</span></a>

  <div class="ov" id="selectOv">
    <div class="card">
      <h1>BAR 夜市</h1>
      <p class="note">お客さんの注文は一瞬で消えちゃう。<br>覚えておいて、同じ品を出してあげてね。<br><span class="oneline">間違えるか待たせすぎるとNG。3回でゲームオーバー。</span></p>
      <div class="choose" id="choose">
        <button data-hero="mama" aria-pressed="true"><span class="pic"></span>まこちゃんママ</button>
        <button data-hero="boy" aria-pressed="false"><span class="pic"></span>みっちゃんママ</button>
        <button data-hero="asuka" aria-pressed="false"><span class="pic"></span>あすかちゃん</button>
      </div>
      <button class="btn" id="open">開店する</button>
      <button class="contact">アプリゲームと広告のお問い合わせ</button>
    </div>
  </div>

  <div class="ov" id="overOv" hidden>
    <div class="card">
      <h2>閉店です</h2>
      <div><span class="lbl">SCORE</span><div class="big" id="final">0</div></div>
      <p class="note" id="overNote"></p>
      <button class="btn" id="again">もう一度開店</button>
      <button class="btn sub" id="change">主人公をえらび直す</button>
      <button class="contact">アプリゲームと広告のお問い合わせ</button>
    </div>
  </div>

  <div class="ov" id="contactOv" hidden style="z-index:12" role="dialog" aria-modal="true" aria-labelledby="contactTitle">
    <div class="card">
      <h2 id="contactTitle">お問い合わせ</h2>
      <div class="flowers" id="ctFlowers" hidden aria-label="お祝いの花の見本"></div>
      <p class="pr">お店様や企業様や個人様のお名前を<br>アプリのゲームに入れることが<br>実現できますので<br>お気軽にご相談ください(^^)</p>
      <p class="note" id="contactNote">アプリゲームと広告のお問い合わせは、<br>下記のメールからお問い合わせください。</p>
      <a class="mail" id="mailAddr" href="mailto:appstudyjapan@gmail.com" target="_blank" rel="noopener">appstudyjapan@gmail.com</a>
      <button class="btn sub" id="copyMail">アドレスをコピー</button>
      <button class="btn" id="closeContact">閉じる</button>
    </div>
  </div>
</div>

<script>
(() => {
// ---------- 広告 ----------
// 広告を出すときはここに入れる。空のままなら枠ごと表示されない。
//   ticker: 流れる文字テロップ。例 ['夜市グループ 新店オープン！', 'ご予約は 03-xxxx-xxxx']
//   tickerLink: テロップを押したときの行き先。'contact' でお問い合わせを開く、URL ならそのページを開く
//   banner: バナー枠。例 { text: '広告の文字', image: 'https://…/banner.png', url: 'https://…' }（text か image のどちらかがあれば表示）
//   tickerScroll: true で文字が流れる、false で止まったまま表示
const ADS = {
  ticker: ['夜市インスタグラムはこちらで検索→ noge_miyakobashi_yoichi'],
  tickerScroll: false,
  tickerLink: null,
  banner: null,
  // お祝いの花（6マス）。企業名を入れると、その場所に花が出る。空文字 '' の場所は花を出さない。全部空なら列ごと非表示
  // { name, span: 2, count: 3 } で2マス分つなげて、花を3つ並べた大きい枠になる
  flowers: ['丸小ハム', '伊藤大商事', '三角紅商事', '自由軒', { name: 'SOFTBONDAI株式会社', span: 2, count: 3 }],
};
const FLOWER_COLS = [['#ff7aa8', '#ffd1e0', '#ff4f86'], ['#ffd34f', '#fff1b8', '#ff9f2e'], ['#ff6b5a', '#ffc2b8', '#e83a3a'], ['#c99bff', '#efe0ff', '#9a5cf0'], ['#7fd0ff', '#e0f4ff', '#3aa0e8'], ['#ffffff', '#ffe6ef', '#ff9cc0']];
function flowerSVG(i) {
  const [a, b, c] = FLOWER_COLS[i % FLOWER_COLS.length];
  const ring = Array.from({ length: 9 }, (_, k) => {
    const t = k / 9 * Math.PI * 2;
    return `<circle cx="${(24 + Math.cos(t) * 10).toFixed(1)}" cy="${(15 + Math.sin(t) * 9).toFixed(1)}" r="5" fill="${k % 2 ? c : a}"/>`;
  }).join('');
  return `<svg viewBox="0 0 48 44" aria-hidden="true">
    <path d="M24 25L14 43M24 25L34 43M24 25v18" stroke="#8a5a30" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="9" cy="21" rx="6" ry="2.6" fill="#3f8a35" transform="rotate(-25 9 21)"/><ellipse cx="39" cy="21" rx="6" ry="2.6" fill="#3f8a35" transform="rotate(25 39 21)"/>
    ${ring}<circle cx="24" cy="15" r="7.5" fill="${b}"/>
    <circle cx="24" cy="15" r="5.2" fill="#fff" stroke="#c8241f" stroke-width=".8"/><text x="24" y="17.8" font-size="7.5" font-weight="900" text-anchor="middle" fill="#c8241f">祝</text>
  </svg>`;
}
function setupFlowers() {
  const slots = (ADS.flowers || []).map(f => typeof f === 'object' && f
    ? { name: String(f.name || '').trim(), span: Math.max(1, Math.min(6, f.span || 1)), count: Math.max(1, f.count || 1) }
    : { name: String(f || '').trim(), span: 1, count: 1 });
  if (!slots.some(s => s.name)) return;
  const box = document.getElementById('flowers');
  let col = 0;
  slots.forEach(s => {
    const d = document.createElement('div');
    d.className = s.name ? 'flower' : 'flower empty';
    if (s.span > 1) d.style.gridColumn = `span ${s.span}`;
    if (s.name) {
      const bunch = document.createElement('div'); bunch.className = 'bunch';
      bunch.innerHTML = Array.from({ length: s.count }, (_, k) => flowerSVG(col + k)).join('');
      const tag = document.createElement('div'); tag.className = 'fname'; tag.textContent = s.name;
      d.append(bunch, tag); d.setAttribute('aria-label', `お祝いの花：${s.name}`);
    }
    col += s.span;
    box.appendChild(d);
  });
  box.hidden = false;
  // お問い合わせ画面にも、同じお祝いの花を見本として出す
  const ct = document.getElementById('ctFlowers');
  ct.innerHTML = box.innerHTML; ct.hidden = false;
}
setupFlowers();
function setupAds() {
  const lines = (ADS.ticker || []).map(s => String(s).trim()).filter(Boolean);
  if (lines.length) {
    const t = document.getElementById('adTickText');
    t.textContent = lines.join('　　◆　　');
    t.style.setProperty('--dur', `${Math.max(12, t.textContent.length * 0.35)}s`);
    const box = document.getElementById('adTicker');
    box.classList.toggle('still', !ADS.tickerScroll);
    if (ADS.tickerLink) {
      box.classList.add('link'); box.tabIndex = 0; box.setAttribute('role', 'button'); box.setAttribute('aria-label', `広告：${t.textContent}`);
      const go = () => ADS.tickerLink === 'contact' ? openContact(box) : window.open(ADS.tickerLink, '_blank', 'noopener');
      box.addEventListener('click', go);
      box.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    }
    box.hidden = false;
  }
  const b = ADS.banner;
  if (b && (b.image || b.text)) {
    const el = document.getElementById('adBanner');
    if (b.image) {
      const img = document.createElement('img');
      img.src = b.image; img.alt = b.text || '広告';
      img.onerror = () => { if (!b.text) el.hidden = true; else { img.remove(); addText(); } };
      el.appendChild(img);
    } else addText();
    function addText() { const s = document.createElement('span'); s.textContent = b.text; el.appendChild(s); }
    if (b.url) el.href = b.url; else el.removeAttribute('target');
    el.setAttribute('aria-label', `広告：${b.text || ''}`);
    el.hidden = false;
  }
}

const shelf = document.getElementById('shelf');
const BOTTLES = ['#4a2a12', '#2d5a2e', '#8a1f2a', '#c98a2a', '#e8e1d0', '#1d3a5a', '#6b3d22', '#3a6a5a', '#a0412d', '#d9b45a', '#2a1a1c'];

});
const grid = document.getElementById('grid');
ITEMS.forEach((it, i) => {

  b.className = 'item'; b.id = `item${i}`;
  b.innerHTML = `${icon(i, 40)}<span>${it.name}</span>`;
  b.addEventListener('click', () => serveItem(i));
  grid.appendChild(b);
});
const seatsEl = document.getElementById('seats');
const SEATS = 4;
const seatEls = [];
for (let i = 0; i < SEATS; i++) {
  const s = document.createElement('div');
  s.className = 'seat empty'; s.setAttribute('role', 'button'); s.setAttribute('aria-label', `${i + 1}番の席`);
  s.innerHTML = `<div class="who"><div class="bubble"></div><div class="face"></div></div><div class="picks"></div><div class="pat"><i></i></div><div class="stool"></div>`;
  s.addEventListener('click', () => selectSeat(i));
  seatsEl.appendChild(s); seatEls.push(s);
}

let hero = 'mama', seats, score, ng, served, level, spawnT, selected, running, lastT;
const $ = id => document.getElementById(id);
const MSGS = {
  normal: { happy: ['ありがとう！', 'これこれ！', 'さすが！', 'おいしい〜'], wrong: 'ちがうよ！', slow: '待ちくたびれた…' },
  western: { happy: ['Thank you!', 'Perfect!', 'おいしい！', 'Amazing!'], wrong: 'No no, ちがうよ！', slow: 'Still waiting…' },
  indian:  { happy: ['Dhanyavaad!', 'Very good!', 'ありがとう！', 'Bahut accha!'], wrong: 'Wrong one!', slow: 'まだかな…' },
  african: { happy: ['Thank you!', 'Nice!', 'さいこう！', 'Great!'], wrong: 'Not this one!', slow: 'So slow…' },
};
function msgFor(c, kind) {
  const m = MSGS[c.cfg.kind] || MSGS.normal;
  return kind === 'happy' ? m.happy[Math.floor(Math.random() * m.happy.length)] : m[kind];
}
function readBest() { try { return +localStorage.getItem('barOboeteteBest') || 0; } catch (e) { return 0; } }
function writeBest(v) { try { localStorage.setItem('barOboeteteBest', String(v)); } catch (e) {} }

const LINES = {
  mama:  { hello: 'いらっしゃい♪ まこです', serve: n => `はい、${n}ね♪`, sorry: 'あら、ごめんなさいね…', level: 'お店がにぎわってきたわね', bye: 'またいらしてね' },
  boy:   { hello: 'いらっしゃい、みっちゃんです♪', serve: n => `${n}、お待たせ♪`, sorry: 'ごめんなさい、すぐ直すわね', level: '今夜はにぎやかね', bye: 'また来てね♪' },
  asuka: { hello: 'いらっしゃいませ〜♡ あすかです', serve: n => `${n}どうぞ〜♡`, sorry: 'やだ、ごめんね〜！', level: '今夜もりあがってる〜♡', bye: 'また指名してね♡' },
};
let sayTimer;
function say(text) {
  const el = $('say'); el.textContent = text; el.classList.add('on');
  clearTimeout(sayTimer); sayTimer = setTimeout(() => el.classList.remove('on'), 1400);
}
let toastTimer;
function toast(text) {
  const el = $('toast'); el.textContent = text; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1600);
}
// お客様が2人以上いるときは、先にお客様を選ぶように案内する
function waitingCount() { return seats ? seats.filter(c => c && ['order', 'wait'].includes(c.state)).length : 0; }
const MULTI_HINT = 'お客様が2人以上の時は、\n必ずお客様を選んでからメニューを選んでね';
function defaultHint() { return waitingCount() >= 2 ? MULTI_HINT : 'お客さんをタップ → 注文の品をタップ'; }
function hint(text, warn) {
  const el = $('hint'); el.textContent = text; el.classList.toggle('warn', !!warn);
  el.classList.toggle('multi', !warn && text === MULTI_HINT);
  if (warn) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
}

const showTime = () => Math.max(0.8, 2.3 - (level - 1) * 0.22);
const maxGuests = () => Math.min(4, level + 1);
const spawnGap = () => Math.max(1.8, 4.2 - (level - 1) * 0.4);
const patience = () => Math.max(14, 26 - (level - 1) * 1.5);
const orderSize = () => {
  if (level < 2) return 1;
  const r = Math.random();
  if (level < 4) return r < 0.3 ? 1 : r < 0.75 ? 2 : 3;
  return r < 0.1 ? 1 : r < 0.55 ? 2 : 3;
};

let ac = null;
function audio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; } }
function tone(f, d, type = 'sine', v = 0.08, delay = 0) {
  if (!ac) return;

  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
}
const sBell = () => { tone(1320, 0.4, 'sine', 0.05); tone(1760, 0.5, 'sine', 0.04, 0.08); };
const sClink = () => { tone(2093, 0.25, 'triangle', 0.06); tone(2637, 0.3, 'sine', 0.04, 0.05); };
const sOk = () => { tone(784, 0.12, 'triangle', 0.07); tone(1047, 0.18, 'triangle', 0.07, 0.09); };
const sNg = () => { tone(180, 0.35, 'sawtooth', 0.07); tone(140, 0.35, 'sawtooth', 0.06, 0.12); };

let musicOn = true, mGain = null, mTimer = null, beat = 0, nextBeat = 0;
const BASS = [[38,41,45,48],[43,47,50,53],[36,40,43,47],[45,49,52,55]];
const CHORDS = [[62,65,69,72],[62,65,67,71],[60,64,67,71],[61,64,67,69]];
const MELODY = [[74,0,72,0],[71,0,0,67],[71,72,0,0],[73,0,76,0], [77,0,76,74],[74,0,71,0],[72,0,0,0],[69,0,0,0]];
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function mNote(f, t, d, type, v) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(mGain); o.start(t); o.stop(t + d + 0.05);
}
function mScheduler() {
  if (!ac) return;
  const q = 60 / (92 + Math.min(30, (level - 1) * 5));
  while (nextBeat < ac.currentTime + 0.15) {
    const bar = Math.floor(beat / 4) % 4, b = beat % 4, t = nextBeat;
    mNote(hz(BASS[bar][b]), t, q * 0.95, 'triangle', 0.5);
    mNote(5200, t, 0.08, 'sine', 0.05);
    mNote(5200, t + q * 0.66, 0.05, 'sine', 0.035);
    if (b === 1 || b === 3) CHORDS[bar].forEach(m => mNote(hz(m), t + (b === 3 ? q * 0.66 : 0), q * 1.1, 'sine', 0.09));
    const mel = MELODY[Math.floor(beat / 4) % 8][b];
    if (mel) mNote(hz(mel + 12), t, q * 0.9, 'sine', 0.07);
    beat++; nextBeat += q;
  }
}
function startMusic() {
  if (!ac || mTimer) return;
  if (!mGain) { mGain = ac.createGain(); mGain.connect(ac.destination); }
  mGain.gain.value = musicOn ? 0.12 : 0;
  beat = 0; nextBeat = ac.currentTime + 0.05;
  mTimer = setInterval(mScheduler, 30);
}
function stopMusic() { clearInterval(mTimer); mTimer = null; }
$('muteBtn').addEventListener('click', () => {
  musicOn = !musicOn;
  $('muteBtn').textContent = musicOn ? '♪ ON' : '♪ OFF';
  $('muteBtn').setAttribute('aria-pressed', String(musicOn));
  if (mGain) mGain.gain.value = musicOn ? 0.12 : 0;
});

function updateHud() {
  $('sc').textContent = score; $('lv').textContent = `レベル${level}`;
  [...$('ngs').children].forEach((el, i) => el.classList.toggle('on', i < ng));
}
function start() {
  audio();
  seats = Array(SEATS).fill(null);
  score = 0; ng = 0; served = 0; level = 1; spawnT = 0.8; selected = -1; running = true;
  seatEls.forEach((_, i) => renderSeat(i));
  $('staffFace').innerHTML = staffSVG(hero, 48);
  $('selectOv').hidden = true; $('overOv').hidden = true;
  updateHud(); hint(defaultHint());
  say(LINES[hero].hello);
  startMusic();
}
function seatGuest(i, cfg, delay = 0) {
  const n = orderSize(), order = [];
  while (order.length < n) { const k = Math.floor(Math.random() * ITEMS.length); if (!order.includes(k)) order.push(k); }
  const pat = patience() + (n - 1) * 6 + delay;
  seats[i] = { cfg, order, picks: [], state: 'enter', t: -delay, show: showTime() + (n - 1) * 0.7, pat, maxPat: pat };
  renderSeat(i);
}
function spawn() {
  const free = seats.map((s, i) => s ? -1 : i).filter(i => i >= 0);
  if (!free.length || seats.filter(Boolean).length >= maxGuests()) return false;
  seatGuest(free[Math.floor(Math.random() * free.length)], customerCfg());
  sBell();
  return true;
}
function renderSeat(i) {
  const el = seatEls[i], c = seats[i];
  const bub = el.querySelector('.bubble'), who = el.querySelector('.face'), picks = el.querySelector('.picks');
  el.classList.toggle('sel', selected === i && !!c);
  if (!c) {
    el.classList.add('empty'); el.classList.remove('leaving');
    bub.className = 'bubble'; who.innerHTML = ''; picks.innerHTML = '';
    return;
  }
  el.classList.remove('empty');
  el.classList.toggle('leaving', c.state === 'leave');
  const mood = c.state === 'happy' ? 'happy' : c.state === 'angry' ? 'angry' : 'normal';
  if (who.dataset.mood !== mood || !who.innerHTML) { who.innerHTML = customerSVG(c.cfg, mood); who.dataset.mood = mood; }
  picks.innerHTML = c.picks.map(p => icon(p, 22)).join('');
  bub.className = 'bubble';
  if (c.state === 'order') { bub.classList.add('on'); bub.innerHTML = c.order.map(o => ITEMS[o].name).join('<br>'); }
  else if (c.state === 'wait' && c.peek > 0) { bub.classList.add('on'); bub.innerHTML = c.order.map(o => ITEMS[o].name).join('<br>'); }
  else if (c.state === 'wait') { bub.classList.add('on', 'q'); bub.textContent = '？'.repeat(c.order.length); }
  else if (c.state === 'happy') { bub.classList.add('on', 'happy'); bub.textContent = c.msg; }
  else if (c.state === 'angry') { bub.classList.add('on', 'angry'); bub.innerHTML = c.msg; }
}
function selectSeat(i) {
  if (!running) return;
  audio();
  const c = seats[i];
  if (!c || !['order', 'wait'].includes(c.state)) return;
  // ？のお客さんをタップすると、注文がもう一度だけ一瞬見える
  if (c.state === 'wait') c.peek = Math.max(0.5, showTime() * 0.4);
  if (selected !== i) {
    const prev = selected; selected = i; if (prev >= 0) renderSeat(prev);
    hint(c.order.length > 1 ? `この方の注文は${c.order.length}品。${c.order.length}つ選んでね` : 'この方の注文は1品。1つだけ選んでね');
  }
  renderSeat(i);
}
function target() {
  if (selected >= 0 && seats[selected] && ['order', 'wait'].includes(seats[selected].state)) return selected;
  const waiting = seats.map((c, i) => c && ['order', 'wait'].includes(c.state) ? i : -1).filter(i => i >= 0);
  return waiting.length === 1 ? waiting[0] : -1;
}
function serveItem(k) {
  if (!running) return;
  audio();
  const i = target();
  if (i < 0) { hint('お客様が2人以上の時は、\n必ずお客様を選んでからメニューを選んでね', true); return; }
  const c = seats[i];
  c.picks.push(k); sClink();
  say(LINES[hero].serve(ITEMS[k].name));
  if (c.picks.length < c.order.length) { selected = i; hint(`あと${c.order.length - c.picks.length}品えらんでね`); renderSeat(i); return; }
  const a = [...c.picks].sort().join(), b = [...c.order].sort().join();
  if (a === b) {
    c.state = 'happy'; c.t = 0;
    c.msg = msgFor(c, 'happy');
    score += 10 * c.order.length + (c.pat > c.maxPat * 0.6 ? 5 : 0);
    served++; sOk();
    const nl = 1 + Math.floor(served / 5);
    if (nl > level) { level = nl; toast(`レベル${level}！`); setTimeout(() => say(LINES[hero].level), 900); }
  } else {
    fail(i, `${msgFor(c, 'wrong')}<br>注文：${c.order.map(o => ITEMS[o].name).join('・')}`);
  }

  hint(defaultHint());
  updateHud(); renderSeat(i);
}
function fail(i, msg) {
  const c = seats[i];
  c.state = 'angry'; c.t = 0; c.msg = msg;
  ng++; sNg(); updateHud();
  setTimeout(() => say(LINES[hero].sorry), 300);
  const scene = $('scene'); scene.classList.remove('shake'); void scene.offsetWidth; scene.classList.add('shake');
  if (selected === i) selected = -1;
  renderSeat(i);
  if (ng >= 3) { running = false; setTimeout(gameOver, 1300); }
}
function gameOver() {
  stopMusic();
  const best = Math.max(readBest(), score); writeBest(best);
  $('final').textContent = score;
  $('overNote').textContent = `${served}人のお客さんに提供 ・ レベル${level} ・ ベスト ${best}`;
  $('overOv').hidden = false; $('again').focus();
  say(LINES[hero].bye);
}

function tick(now) {
  try { tickBody(now); } catch (e) { console.error(e); }
  requestAnimationFrame(tick);
}
function tickBody(now) {
  const dt = Math.min(0.1, (now - (lastT || now)) / 1000); lastT = now;
  if (running) {
    spawnT -= dt;
    if (selected < 0 && $('hint').textContent !== defaultHint()) hint(defaultHint());
    if (spawnT <= 0) spawnT = spawn() ? spawnGap() * (0.8 + Math.random() * 0.4) : 0.4;
    seats.forEach((c, i) => {
      if (!c) return;
      c.t += dt;
      if (c.state === 'enter' && c.t > 0.45) { c.state = 'order'; c.t = 0; renderSeat(i); }
      else if (c.state === 'order' && c.t > c.show) { c.state = 'wait'; c.t = 0; renderSeat(i); }
      if (c.peek > 0) { c.peek -= dt; if (c.peek <= 0 || c.state !== 'wait') { c.peek = 0; renderSeat(i); } }
      if (c.state === 'order' || c.state === 'wait') {
        c.pat -= dt;
        if (c.pat <= 0) fail(i, msgFor(c, 'slow'));
      }
      if ((c.state === 'happy' || c.state === 'angry') && c.t > 1.3) { c.state = 'leave'; c.t = 0; renderSeat(i); }
      else if (c.state === 'leave' && c.t > 0.4) { seats[i] = null; renderSeat(i); }
    });
  }
  if (seats) seats.forEach((c, i) => {
    const bar = seatEls[i].querySelector('.pat i');
    if (!c) return;
    const k = Math.max(0, c.pat / c.maxPat);
    bar.style.width = `${k * 100}%`;
    bar.style.background = k > 0.5 ? 'var(--ok)' : k > 0.25 ? 'var(--amber)' : 'var(--ng)';
  });
}

// ---------- select screen ----------
const pickBtns = [...document.querySelectorAll('#choose button')];
pickBtns.forEach(b => {
  b.querySelector('.pic').innerHTML = staffSVG(b.dataset.hero, 76);
  b.addEventListener('click', () => pick(b.dataset.hero));
});
function pick(k) {
  hero = k;
  pickBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.hero === k)));
  $('staffFace').innerHTML = staffSVG(hero, 48);
}
$('open').addEventListener('click', start);
$('again').addEventListener('click', start);
$('change').addEventListener('click', () => { $('overOv').hidden = true; $('selectOv').hidden = false; });

seats = Array(SEATS).fill(null); level = 1;
$('staffFace').innerHTML = staffSVG(hero, 48);
seats[1] = { cfg: { skin: '#e8b88f', hair: '#5a3420', shirt: '#3a5a8a', style: 0, glasses: true, beard: false }, order: [2], picks: [], state: 'order', t: 0, show: 99, pat: 20, maxPat: 20 };
seats[2] = { cfg: { skin: '#f6dcc6', hair: '#2a1a1c', shirt: '#7a3a5a', style: 1, glasses: false, beard: false }, order: [8], picks: [], state: 'wait', t: 0, show: 0, pat: 12, maxPat: 20 };
renderSeat(1); renderSeat(2);
requestAnimationFrame(tick);
})();

.upd button:focus-visible,.ver button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;padding:13px 10px;border:0;border-radius:8px;cursor:pointer;
  background:var(--neon);color:#fff;font-family:var(--body);font-weight:900;font-size:17px;line-height:1.3;box-shadow:0 0 14px rgba(255,92,147,.55)}
.dl svg{flex:none;width:22px;height:22px}
.dl span{display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.dl small{font-size:13px;font-weight:700}
.dl:active{transform:scale(.98)}
.dl:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.steps{margin:0;padding-left:1.4em;text-align:left;font-size:15px;line-height:1.7;color:var(--fg)}
.steps b{color:var(--amber)}
.pointer{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);color:var(--amber);font-size:28px;line-height:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,6px)}}
@media (prefers-reduced-motion:reduce){.pointer{animation:none}}
</style>
<script>
// 「アプリをダウンロードして遊ぶ」ボタン。ホーム画面から開いているときは出さない
(() => {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  let promptEvt = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptEvt = e; });

  if (!standalone) {
    document.getElementById('open').insertAdjacentHTML('afterend',
      `<button class="dl" id="dlBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg><span>アプリをダウンロードして遊ぶ<small>（無料）</small></span></button>`);
    document.getElementById('app').insertAdjacentHTML('beforeend', `
      <div class="ov" id="dlOv" hidden style="z-index:12" role="dialog" aria-modal="true" aria-labelledby="dlTitle">
        <div class="card"><h2 id="dlTitle"></h2><ol class="steps" id="dlSteps"></ol><button class="btn" id="dlOk">OK</button></div>
        <div class="pointer" id="dlPointer" hidden aria-hidden="true">↓</div>
      </div>`);
    const ov = document.getElementById('dlOv');
    const show = (title, steps, pointDown) => {
      document.getElementById('dlTitle').textContent = title;
      document.getElementById('dlSteps').innerHTML = steps.map(s => `<li>${s}</li>`).join('');
      document.getElementById('dlPointer').hidden = !pointDown;
      ov.hidden = false; document.getElementById('dlOk').focus();
    };
    const close = () => { ov.hidden = true; document.getElementById('dlBtn').focus(); };
    document.getElementById('dlOk').addEventListener('click', close);
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !ov.hidden) close(); });

    document.getElementById('dlBtn').addEventListener('click', async () => {
      if (promptEvt) {
        promptEvt.prompt();
        await promptEvt.userChoice.catch(() => {});
        promptEvt = null;
      } else if (ios) {
        show('iPhoneに追加する方法', ['画面下の <b>共有ボタン</b>（四角から矢印が上に出ているマーク）を押す', '<b>「ホーム画面に追加」</b>を押す', '右上の <b>「追加」</b>を押す'], true);
      } else if (android) {
        show('Androidに追加する方法', ['右上の <b>︙</b>（縦に点3つ）を押す', '<b>「アプリをインストール」</b>か<b>「ホーム画面に追加」</b>を押す', '<b>「インストール」</b>を押す'], false);
      } else {
        location.href = 'install.html';
      }
    });
    addEventListener('appinstalled', () => { const b = document.getElementById('dlBtn'); if (b) b.hidden = true; });
  }
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();

// 最新版にする。スマホに保存した古い版を消してから読み込み直すので、iPhone でも Android でも同じように入れ替わる
(() => {
  const mine = window.APP_VERSION;
  const fmt = v => `${v.slice(0, 4)}.${v.slice(4, 6)}.${v.slice(6, 8)}-${v.slice(8, 12)}`;
  const latest = () => fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()).then(j => j.version).catch(() => null);
  async function updateNow() {
    try {
      const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration();
      if (reg) await reg.unregister();
      await Promise.all((await caches.keys()).map(k => caches.delete(k)));
    } catch (e) {}
    location.replace(`${location.pathname}?v=${Date.now()}`);
  }

  // バージョンの横：古い版なら「新しいバージョンに更新」ボタン、最新なら「最新版です」
  document.querySelector('#selectOv .card').insertAdjacentHTML('beforeend',
    `<div class="ver"><span>Ver.${fmt(mine)}</span><em id="verState"></em><button id="verBtn" class="new" hidden>新しいバージョンに更新</button></div>`);
  const btn = document.getElementById('verBtn');
  btn.addEventListener('click', () => { btn.textContent = '更新中…'; updateNow(); });

  // 開いたとき・アプリに戻ってきたときに確かめて、新しい版があれば知らせる
  async function check() {
    const v = await latest();
    if (!v) return;
    btn.hidden = v === mine;
    document.getElementById('verState').textContent = v === mine ? '最新版です' : '';
    if (v === mine || document.getElementById('updBar')) return;
    document.body.insertAdjacentHTML('beforeend',
      `<div class="upd" id="updBar" role="status"><span>新しいバージョンがあります</span><button id="updBtn">最新版にする</button></div>`);
    document.getElementById('updBtn').addEventListener('click', e => { e.currentTarget.textContent = '更新中…'; updateNow(); });
  }
  check();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
})();
</script>
</body>
</html>
